{# templates/partials/breadcrumb.html #}
{% if breadcrumbs %}
<nav aria-label="Breadcrumb" class="bg-stone-100 dark:bg-navy-800 border-b border-stone-200 dark:border-navy-700">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5">
    <ol class="flex items-center flex-wrap gap-1.5 text-sm" itemscope itemtype="https://schema.org/BreadcrumbList">
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a href="/" itemprop="item" class="text-neutral-500 dark:text-stone-400 hover:text-navy-600 dark:hover:text-white transition-colors flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span itemprop="name">Home</span>
        </a>
        <meta itemprop="position" content="1" />
      </li>
      {% for label, url in breadcrumbs %}
      <li class="flex items-center gap-1.5" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <svg class="w-3 h-3 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        {% if url %}
        <a href="{{ url }}" itemprop="item" class="text-neutral-500 dark:text-stone-400 hover:text-navy-600 dark:hover:text-white transition-colors">
          <span itemprop="name">{{ label }}</span>
        </a>
        {% else %}
        <span class="text-neutral-900 dark:text-white font-medium" itemprop="name" aria-current="page">{{ label }}</span>
        {% endif %}
        <meta itemprop="position" content="{{ forloop.counter|add:1 }}" />
      </li>
      {% endfor %}
    </ol>
  </div>
</nav>
{% endif %}
