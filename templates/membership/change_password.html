{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-6 flex items-center gap-3">
    <a href="{% url 'membership:dashboard' %}" class="text-sm text-neutral-500 hover:text-union-red transition-colors">← Dashboard</a>
    <span class="text-stone-300">|</span>
    <h1 class="font-serif text-xl font-bold text-neutral-900 dark:text-white bilingual-heading" data-hi="पासवर्ड बदलें">Change Password</h1>
  </div>
  {% if messages %}{% for m in messages %}<div class="mb-5 px-4 py-3 rounded-lg text-sm font-medium {% if m.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">{{ m }}</div>{% endfor %}{% endif %}
  <div class="bg-white dark:bg-navy-800 border border-stone-200 dark:border-navy-700 rounded-2xl p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div><label class="block text-sm font-medium text-neutral-700 dark:text-stone-300 mb-1.5">Current Password</label><input type="password" name="old_password" required class="w-full px-4 py-2.5 text-sm border border-stone-300 dark:border-navy-600 rounded-lg bg-white dark:bg-navy-700 text-neutral-900 dark:text-white focus:ring-2 focus:ring-navy-500 outline-none"></div>
      <div><label class="block text-sm font-medium text-neutral-700 dark:text-stone-300 mb-1.5">New Password</label><input type="password" name="new_password1" required minlength="8" class="w-full px-4 py-2.5 text-sm border border-stone-300 dark:border-navy-600 rounded-lg bg-white dark:bg-navy-700 text-neutral-900 dark:text-white focus:ring-2 focus:ring-navy-500 outline-none"></div>
      <div><label class="block text-sm font-medium text-neutral-700 dark:text-stone-300 mb-1.5">Confirm New Password</label><input type="password" name="new_password2" required minlength="8" class="w-full px-4 py-2.5 text-sm border border-stone-300 dark:border-navy-600 rounded-lg bg-white dark:bg-navy-700 text-neutral-900 dark:text-white focus:ring-2 focus:ring-navy-500 outline-none"></div>
      <button type="submit" class="w-full py-3 bg-navy-600 text-white font-semibold rounded-lg hover:bg-navy-700 transition-colors text-sm mt-2">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
