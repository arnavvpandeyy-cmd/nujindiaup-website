{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-6 flex items-center gap-2 text-sm text-neutral-500 dark:text-stone-400">
    <a href="/newsroom/" class="hover:text-union-red transition-colors">Newsroom</a>
    <span>›</span><a href="/newsroom/press-releases/" class="hover:text-union-red transition-colors">Press Releases</a>
    <span>›</span><span class="text-neutral-700 dark:text-stone-300 truncate">{{ release.title }}</span>
  </div>
  <div class="flex items-center gap-2 mb-3"><span class="w-5 h-0.5 bg-union-red"></span><span class="text-xs font-semibold uppercase tracking-widest text-union-red">Press Release</span></div>
  <h1 class="font-serif text-3xl lg:text-4xl font-bold text-neutral-900 dark:text-white leading-tight mb-4">{{ release.title }}</h1>
  <div class="flex items-center gap-4 text-sm text-neutral-500 dark:text-stone-400 mb-8 pb-6 border-b border-stone-200 dark:border-navy-700">
    <span>{{ release.published_at|date:"j N Y" }}</span>
    {% if release.pdf_file %}<a href="{{ release.pdf_file.url }}" class="flex items-center gap-1 font-medium text-union-red hover:text-red-700 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Download PDF</a>{% endif %}
  </div>
  <div class="prose prose-neutral dark:prose-invert max-w-none text-neutral-800 dark:text-stone-200 leading-relaxed">{{ release.body|safe }}</div>
</div>
{% endblock %}
