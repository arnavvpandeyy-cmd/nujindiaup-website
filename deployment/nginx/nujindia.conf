# NUJ India Nginx configuration
# Place at: /etc/nginx/sites-available/nujindia
# Then: sudo ln -s /etc/nginx/sites-available/nujindia /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name nujindia.org www.nujindia.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nujindia.org www.nujindia.org;

    # SSL (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/nujindia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nujindia.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size (for file uploads)
    client_max_body_size 15M;

    # Static files served directly by Nginx
    location /static/ {
        alias /var/www/nujindia/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /var/www/nujindia/media/;
        expires 30d;
        add_header Cache-Control "public";
        # Security: prevent direct execution of uploaded files
        add_header Content-Disposition "attachment";
        access_log off;
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://unix:/run/nujindia/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Robots and sitemap
    location = /robots.txt {
        proxy_pass http://unix:/run/nujindia/gunicorn.sock;
    }
    location = /sitemap.xml {
        proxy_pass http://unix:/run/nujindia/gunicorn.sock;
    }

    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml;
    gzip_vary on;

    access_log /var/log/nginx/nujindia_access.log;
    error_log /var/log/nginx/nujindia_error.log;
}
